# Host profile: the Akai Force (docs/hosts/akai-force.md). Selected at runtime with
# `rpi-audiod host akai-force` or on the OLED (Outputs > Host); a file here only lists what the host needs.

[slots]
# With the mpc_internal_io add-on, MPC inputs 25/26 are the Force's own inputs
# and whatever the Pi sends there is replaced (docs/hosts/akai-force-internal-io.md).
reserve_in = [25, 26]
