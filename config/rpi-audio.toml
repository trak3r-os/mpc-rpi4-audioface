# rpi-audiod settings, installed as /etc/rpi-audio/rpi-audio.toml. Files in
# /etc/rpi-audio/rpi-audio.d/*.toml are read after it and override it, table by
# table (host-specific ones come from tools/hosts/, e.g. `deploy.sh --host akai-force`).
# The gadget's channels and sample size come from gadget.env.

[gadget]
card = "UAC2Gadget"          # ALSA card id of the gadget on the Pi

[engine]
# "host" (the default): jackd on the gadget while the host streams both ways (mode A, docs/PLAN.md §2).
# "standalone": no host; jackd drives a local card from the start ([standalone] below, docs/STANDALONE.md).
# mode = "host"
# 26 ch S16 at 44.1 kHz run at a period of 64 (docs/hw/2026-10-29-f2-jack-bench.md).
period = 64
periods = 3
priority = 70

[standalone]
# The local card jackd drives in standalone mode, as one destination for the device routes.
# Every key is optional; these are the defaults, for a pHAT DAC on dtoverlay=hifiberry-dac.
# card = "sndrpihifiberry"   ALSA card id (aplay -l)
# channels = 2
# rate = 48000
# period = 256               frames; the USB bridges add their own buffering
# periods = 3
# identity = "local-dac"     how routes, mutes and the display name it
# name = "pHAT DAC"

[bridge]
# zita-a2j / zita-j2a per device direction: period and number of periods.
period = 256
periods = 2
# Device rate: the first of these the device supports, otherwise its highest.
# 48000 first: a PCM2902 (Behringer mixers) failed to capture at 44100 next to
# another full-speed device (docs/hw/2026-10-29-f2-usb-devices.md).
rates = [48000, 44100]
# A device whose playback volume comes up at 0 on every channel (the GP-150 does)
# is raised to this, so it is not silent.
min_volume = "80%"
# ALSA card ids never bridged.
ignore = []

[midi]
# The gadget's USB MIDI function (GADGET_MIDI_PORTS and GADGET_MIDI_ID in gadget.env, docs/MIDI.md).
control_port = 1             # the port that carries the control map; devices get the others
channel_in = 16              # control CCs for what goes to the host (IN) on that port
channel_out = 15             # and for what comes from it (OUT)

[slots]
# Gadget channels never given to a device, 1-based. "in" is Pi -> host,
# "out" is host -> Pi; out 1-2 are usually the host's main mix.
reserve_in = []
reserve_out = [1, 2]

[usb]
# The most periodic (isochronous) full-speed bytes per frame one USB bus takes. A full-speed
# device direction whose load does not fit what the running bridges leave is not started
# (it waits, with the reason in `rpi-audiod status`) until another device leaves.
# High-speed devices cost nothing. 1099 is what the Pi 4's VL805 accepted
# (docs/hw/2026-10-29-f2-usb-devices.md); 0 turns the check off.
fs_budget = 1099

[ui]
# rpi-audio-ui, the OLED and rotary encoder (docs/DISPLAY.md); it only runs when installed with --hat.
# Every key is optional; these are the defaults.
# bus = 1                  /dev/i2c-1: the header's SDA/SCL (GPIO 2/3)
# address = 0x3C           the SH1106's I2C address (0x3D on some boards)
# flip = false             true turns the picture 180 degrees
# contrast = 127           0..255
# idle_s = 60              seconds without input before the display goes dark (an OLED burns in); 0 never
# invert_encoder = false   true if the knob goes the wrong way
# pins = { a = 17, b = 27, push = 22, confirm = 23, back = 24 }   BCM numbers; give only the ones that differ

# Optional per-device profiles go in /etc/rpi-audio/devices.d/*.toml, one device per file
# (installed from config/devices.d/). Keys, all but `match` optional:
#   match = "84ef:0186"     idVendor:idProduct, lowercase hex
#   bcd = "0101"            only this bcdDevice (a device's "shape", e.g. a firmware mode);
#                           a profile with a matching bcd beats one without
#   name = "..."            display name in status
#   rate = 48000            preferred rate, tried before [bridge] rates
#   start_in = 3            preferred first gadget channel (IN: Pi -> host, OUT: host -> Pi)
#   start_out = 5           when the device has no saved block and the block is free;
#                           saved blocks always win
#   names_in = ["L", "R"]   device channel names shown in status, from channel 1
#   names_out = ["L", "R"]
#   ignore_in = [3, 4]      device channels (1-based) with no gadget slot and no route;
#   ignore_out = []         the bridge still opens all of them
# A bad `match` ignores the file; an unknown key or bad value is logged and ignored. Two equally
# specific profiles for one device: the first by file name is used, with a warning.
