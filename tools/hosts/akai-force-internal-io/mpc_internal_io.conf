# mpc_internal_io settings (rpi-audio). Read when MPC starts; MIO_<KEY>
# environment variables override them. Channels are 1-based.

# ALSA card id of the rpi-audio gadget as the Force sees it.
gadget_id = rpiaudio
# The Force's own codec.
codec_pcm = hw:CARD=ADA2

# MPC output (gadget channel) : codec output. Codec 1/2 are the main outs, 3/4
# the headphones [?]. Default: MPC's master (1/2) to both.
playback = 1:1, 2:2, 1:3, 2:4
# MPC input (gadget channel) : codec input. Default: the Force's two inputs
# arrive in MPC as inputs 25/26; the Pi leaves those free.
capture = 25:1, 26:2

# Gain on the way to the codec. The Force's volume knob does nothing while MPC
# is on an external device, so start low.
gain_db = -12

# Codec period and buffer, and how much audio is kept in flight (frames at 44.1 kHz).
period = 64
buffer = 1024
queue = 256
ring = 256

# Status lines in MPC's log every ~30 s.
verbose = 1
# 1 = load but touch nothing (MPC's audio passes through untouched).
off = 0
